<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="../estilos/global.css">
    <link rel="stylesheet" href="../estilos/cadastro.css">
    <title>Crie a sua conta - AcessoSP</title>
</head>
<body>
    <header>
        <div class="cabecalho_navegacao">
            <a href="index.html" class="logo">
                <img class="cabecalho_navegacao-logo" src="assets/logo-header.png" alt="Logo do AcessoSP">
            </a>
            
            <nav>
                <a class="cabecalho_navegacao_links" href="index.html">AcessoSP</a>
                <a class="cabecalho_navegacao_links" href="locais-avaliados.html">Locais avaliados</a>
                <a class="cabecalho_navegacao_links" href="profissionais.html">Profissionais</a>
            </nav>

            <a class="cabecalho_link_entrar" href="login.html">
                <i class="fa-regular fa-user"></i> Entrar
            </a>
        </div>
    </header>

    <main>
        <h1>Crie a sua conta</h1>
        
        <div class="cadastro-container">
            <button class="btn-social">
                <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" alt="Google">
                <span>Continuar com Google</span>
            </button>
            
            <button class="btn-social">
                <img src="https://cdn-icons-png.flaticon.com/512/0/747.png" alt="Apple">
                <span>Continuar com a Apple</span>
            </button>
            
            <p class="paragrafo-ou">ou</p>
            
            <form action="processa_cadastro.php" method="post">
                <input class="input-padrao" placeholder="Digite seu e-mail" type="email" name="email" id="iemail" required>
                
                <input class="input-padrao" placeholder="Verifique seu e-mail" type="email" name="confirma_email" id="icorretor-email" required>
                
                <div class="input-senha-wrapper">
                    <input class="input-padrao" placeholder="Senha" type="password" name="senha" id="isenha" required>
                    <i class="fa-solid fa-eye icon-eye"></i>
                </div>

                <div class="checkbox-wrapper">
                    <input type="checkbox" id="comunicacoes" name="comunicacoes">
                    <label for="comunicacoes">Gostaria de receber comunicações comerciais da Doctoralia (opcional).</label>
                </div>
                
                <button type="submit" class="btn-cadastrar">Criar perfil gratuito</button>
                
                <p class="termos-legais">
                    Ao se registrar, você está de acordo com nossos <a href="termos.html">termos e condições</a>, e confirma estar ciente de nossa <a href="privacidade.html">política de privacidade</a>.
                </p>
            </form>
        </div>
    </main>
</body>
</html>
